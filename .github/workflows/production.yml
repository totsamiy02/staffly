name: Production smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: artifacts/browser-binaries
      - run: npm run test:production
      - name: Build maintenance and observer images
        run: |
          docker build --target maintenance --tag staffly-maintenance-ci:local .
          docker build --target observer --tag staffly-observer-ci:local .
      - name: Verify operator dependencies without network or credentials
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --entrypoint node --volume "$PWD/tests/production/operator-imports.mjs:/app/tests/production/operator-imports.mjs:ro" staffly-maintenance-ci:local --import tsx tests/production/operator-imports.mjs maintenance
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --entrypoint node --volume "$PWD/tests/production/operator-imports.mjs:/app/tests/production/operator-imports.mjs:ro" staffly-observer-ci:local --import tsx tests/production/operator-imports.mjs observer
      - name: Save container diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tests/**/production-*/report.json
            artifacts/tests/**/production-*/*.log
            artifacts/tests/**/production-*/*.png
          retention-days: 7
          if-no-files-found: warn

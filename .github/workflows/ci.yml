name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, diploma-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Validate migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: npm run ci:migrations

  server:
    name: Empty database and server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 18 binaries
        run: bash scripts/ci/install-postgres.sh
      - run: npx prisma generate
      - name: Apply all migrations to a fresh cluster and run server tests
        run: npm run test:isolated -- --pg-bin=/usr/lib/postgresql/18/bin --quiet=true
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests/
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  gate:
    name: CI gate
    if: always()
    needs: [quality, server, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          SERVER: ${{ needs.server.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          test "$QUALITY" = success
          test "$SERVER" = success
          test "$SECURITY" = success

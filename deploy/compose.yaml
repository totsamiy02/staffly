name: staffly
x-app: &app
  build: {context: .., target: runtime}
  image: staffly:local
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    LIVE_DATABASE_URL: ${LIVE_DATABASE_URL:-}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
    INVITE_CODE_SECRET: ${INVITE_CODE_SECRET:?Set INVITE_CODE_SECRET}
    SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
    SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:?Set SMTP_APP_PASSWORD}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    S3_REGION: ${S3_REGION:-us-east-1}
    METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
    YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
    YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3001'
    RUN_BACKGROUND_WORKERS: 'false'
    API_WARMUP: 'true'
    TRUST_PROXY: 172.30.40.10/32
    STORAGE_DRIVER: s3
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    S3_ALLOW_INSECURE: 'false'
    DB_POOL_MAX: '10'
    DB_TIMEZONE: ${DB_TIMEZONE:?Set DB_TIMEZONE}
    HTTP_SHUTDOWN_TIMEOUT_MS: '30000'
    NODE_OPTIONS: --max-old-space-size=${API_HEAP_MIB:-768}
  mem_limit: ${API_MEMORY_LIMIT:-1536m}
  restart: unless-stopped
  stop_grace_period: 45s
  init: true
  read_only: true
  tmpfs: ['/tmp:size=512m,mode=1777']
  ulimits:
    nofile: {soft: 32768, hard: 32768}
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    start_period: 20s
  depends_on:
    postgres: {condition: service_healthy}
  networks: [backend]
services:
  postgres:
    image: postgres:18
    command: [postgres, -c, 'timezone=${DB_TIMEZONE:?Set DB_TIMEZONE to the source database timezone}']
    environment:
      POSTGRES_DB: staffly
      POSTGRES_USER: staffly_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-database.sql:/docker-entrypoint-initdb.d/10-staffly.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U staffly_admin -d staffly]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  migrate:
    <<: *app
    build: {context: .., target: build}
    image: staffly-migrations:local
    restart: 'no'
    read_only: false
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    command: [node, deploy/migrate.mjs]
    healthcheck: {disable: true}
  api1:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
  api2:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
  api3:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
  api4:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    <<: *app
    command: [node, --import, tsx, src/server/worker.ts]
    environment: {<<: *app-env, DB_POOL_MAX: '4', NODE_OPTIONS: '--max-old-space-size=512'}
    mem_limit: ${WORKER_MEMORY_LIMIT:-1536m}
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, node, -e, "try{process.exit(Date.now()-require('fs').statSync('/tmp/staffly-worker-health').mtimeMs<45000?0:1)}catch{process.exit(1)}"]
      interval: 15s
      timeout: 5s
      start_period: 45s
    depends_on: {migrate: {condition: service_completed_successfully}}
  edge:
    build: {context: .., target: edge}
    image: staffly-edge:local
    ports: ['${BIND_ADDRESS:-127.0.0.1}:443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/staffly-proxy.conf:ro
      - ./cloudflare-realip.conf:/etc/nginx/staffly-cloudflare-realip.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
      api3: {condition: service_healthy}
      api4: {condition: service_healthy}
    restart: unless-stopped
    networks:
      backend: {ipv4_address: 172.30.40.10}
networks:
  backend: {ipam: {config: [{subnet: 172.30.40.0/24}]}}
volumes:
  postgres:

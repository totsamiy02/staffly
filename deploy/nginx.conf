worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 8192; multi_accept on; }
http {
    include /etc/nginx/staffly-cloudflare-realip.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # OAuth code/state, tokens and query strings are never included in access logs.
    log_format safe '$remote_addr $request_method $uri $status $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    proxy_read_timeout 75s;
    # Coarse IP budgets allow a normal office behind one NAT. Fine-grained,
    # shared per-account budgets are enforced after authentication in the API.
    limit_req_zone $binary_remote_addr zone=ip_requests:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ip_auth:10m rate=20r/s;
    limit_req_zone $server_name zone=all_requests:1m rate=2000r/s;
    limit_conn_zone $binary_remote_addr zone=ip_connections:20m;
    limit_conn_zone $server_name zone=all_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    upstream staffly_api {
        zone staffly_api 256k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        least_conn;
        server api1:3001 resolve max_fails=3 fail_timeout=10s;
        server api2:3001 resolve max_fails=3 fail_timeout=10s;
        server api3:3001 resolve max_fails=3 fail_timeout=10s;
        server api4:3001 resolve max_fails=3 fail_timeout=10s;
        keepalive 128;
    }
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        root /srv/staffly;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security 'max-age=15768000' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        limit_conn ip_connections 512;
        limit_conn all_connections 20000;
        location = /api/live {
            limit_req zone=ip_requests burst=500 nodelay;
            limit_req zone=all_requests burst=1000 nodelay;
            include /etc/nginx/staffly-proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 45s;
            gzip off;
        }
        location /api/auth/ {
            limit_req zone=ip_auth burst=80 nodelay;
            limit_req zone=all_requests burst=1000 nodelay;
            include /etc/nginx/staffly-proxy.conf;
        }
        location /api/ {
            limit_req zone=ip_requests burst=500 nodelay;
            limit_req zone=all_requests burst=1000 nodelay;
            include /etc/nginx/staffly-proxy.conf;
        }
        location /health/ { return 404; }
        location /internal/ { return 404; }
        location /assets/ { expires 1y; try_files $uri =404; }
        location / { expires -1; try_files $uri $uri/ /index.html; }
    }
}

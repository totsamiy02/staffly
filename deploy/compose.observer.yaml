# Run independently of the application host. No channel is enabled automatically.
services:
  observer:
    build: {context: .., target: observer}
    image: ${OBSERVER_IMAGE:-staffly-observer:local}
    environment:
      NODE_ENV: production
      ADMIN_OBSERVER_DATABASE_URL: ${ADMIN_OBSERVER_DATABASE_URL:?Set independent observer database URL}
      ADMIN_OBSERVER_STATE_DIRECTORY: /var/lib/staffly/observer
      ADMIN_PROBE_URL: ${ADMIN_PROBE_URL:-}
      ADMIN_SIGNAL_WEBHOOK_URL: ${ADMIN_SIGNAL_WEBHOOK_URL:-}
      ADMIN_SIGNAL_WEBHOOK_TOKEN: ${ADMIN_SIGNAL_WEBHOOK_TOKEN:-}
      ADMIN_SIGNAL_TELEGRAM_TOKEN: ${ADMIN_SIGNAL_TELEGRAM_TOKEN:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
    volumes: ['observer-state:/var/lib/staffly/observer']
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 256m
volumes:
  observer-state:
